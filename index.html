<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魚仕分け</title>
  <meta name="description" content="寿司屋の大将の注文にこたえて、そっくりな2匹の魚から正しい方を選ぶ2択クイズゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="魚仕分け｜そっくりな魚、正しいのはどっち？">
  <meta property="og:description" content="寿司屋の大将の注文にこたえて、そっくりな2匹の魚から正しい方を選ぶ2択クイズ。全50組、目利きの腕だめし！">
  <meta property="og:url" content="https://techgymjp.github.io/shiwake/">
  <meta property="og:image" content="https://techgymjp.github.io/shiwake/img/ogp.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="sound-toggles">
    <button type="button" class="toggle" id="tg-bgm" aria-pressed="true">♪ BGM</button>
    <button type="button" class="toggle" id="tg-se" aria-pressed="true">🔔 効果音</button>
    <button type="button" class="toggle" id="tg-voice" aria-pressed="true">🗣 声</button>
  </div>

  <main id="app">
    <!-- タイトル -->
    <section id="screen-title" class="screen active">
      <div class="noren" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1 class="logo"><span>魚</span><span>仕</span><span>分</span><span>け</span></h1>
      <div class="chef-row">
        <div class="chef" id="title-chef"></div>
        <p class="bubble">へい、らっしゃい！<br>おまえさんの<strong>目利き</strong>の腕前、<br>見せてもらおうか！</p>
      </div>
      <div class="title-fish" id="title-fish"></div>
      <p class="genre-title">ジャンルをえらぶ</p>
      <div class="genres" id="genres" role="radiogroup" aria-label="ジャンル"></div>
      <p class="genre-note">問題は「やさしい」から「むずかしい」の順に出ます</p>
      <label class="name-field">板前の名前
        <input type="text" id="player-name" maxlength="10" placeholder="名無しの板前" autocomplete="nickname">
      </label>
      <div class="menu">
        <button class="btn primary big" id="btn-start">板場に立つ！（10問）</button>
        <button class="btn" id="btn-ranking">🏆 ランキング</button>
        <button class="btn" id="btn-zukan">📖 見分け図鑑</button>
      </div>
      <p class="best" id="best-score"></p>
    </section>

    <!-- 問題 -->
    <section id="screen-quiz" class="screen">
      <header class="quiz-head">
        <div class="status">
          <span class="chip" id="q-count">1 / 10</span>
          <span class="chip level" id="q-level"></span>
          <span class="chip score" id="q-score">正解 0</span>
          <span class="chip combo" id="q-combo" hidden></span>
        </div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      </header>
      <div class="chef-row order">
        <div class="chef" id="quiz-chef"></div>
        <h2 class="bubble question" id="question"></h2>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" hidden>
        <p class="verdict" id="verdict"></p>
        <p class="point" id="point"></p>
        <button class="btn primary" id="btn-next">次へ</button>
      </div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen">
      <h2 class="result-title">本日の仕分け結果</h2>
      <p class="result-genre" id="r-genre"></p>
      <p class="result-score"><span id="r-score">0</span><small> / <span id="r-total">10</span></small></p>
      <p class="result-time" id="r-time"></p>
      <p class="rank" id="r-rank"></p>
      <p class="rank-in" id="r-rankin" hidden></p>
      <div class="chef-row">
        <div class="chef" id="result-chef"></div>
        <p class="bubble" id="r-msg"></p>
      </div>
      <div class="share">
        <p class="share-title">結果をシェアする</p>
        <p class="share-marks" id="share-marks"></p>
        <div class="share-buttons">
          <a class="share-btn x" id="share-x" href="#" target="_blank" rel="noopener">𝕏 ポスト</a>
          <a class="share-btn line" id="share-line" href="#" target="_blank" rel="noopener">LINE</a>
          <a class="share-btn fb" id="share-fb" href="#" target="_blank" rel="noopener">Facebook</a>
          <button type="button" class="share-btn more" id="share-native" hidden>📤 その他</button>
          <button type="button" class="share-btn copy" id="share-copy">🔗 コピー</button>
        </div>
        <p class="share-toast" id="share-toast" role="status"></p>
      </div>
      <div class="review" id="review"></div>
      <div class="menu">
        <button class="btn primary big" id="btn-retry">もう一回！</button>
        <button class="btn" id="btn-result-ranking">🏆 ランキング</button>
        <button class="btn" id="btn-home">のれんへ戻る</button>
      </div>
    </section>

    <!-- ランキング -->
    <section id="screen-ranking" class="screen">
      <h2 class="zukan-title">🏆 ランキング</h2>
      <p class="ranking-note">この端末での記録です（ジャンルごとに上位10件）</p>
      <div class="genres" id="ranking-tabs" role="tablist" aria-label="ジャンル"></div>
      <div class="ranking" id="ranking-list"></div>
      <div class="menu">
        <button class="btn" id="btn-ranking-back">のれんへ戻る</button>
        <button class="btn danger" id="btn-ranking-clear">記録を消す</button>
      </div>
    </section>

    <!-- 図鑑 -->
    <section id="screen-zukan" class="screen">
      <h2 class="zukan-title">📖 見分け図鑑 <small id="zukan-count"></small></h2>
      <div class="genres" id="zukan-tabs" role="tablist" aria-label="ジャンル"></div>
      <div class="zukan" id="zukan"></div>
      <div class="menu">
        <button class="btn" id="btn-zukan-back">のれんへ戻る</button>
      </div>
    </section>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="js/fish.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
