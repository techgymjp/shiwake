<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魚仕分け</title>
  <meta name="description" content="そっくりな2匹の魚から、正しい方を選ぶ2択クイズゲーム。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <!-- タイトル -->
    <section id="screen-title" class="screen active">
      <h1 class="logo"><span>魚</span><span>仕</span><span>分</span><span>け</span></h1>
      <p class="lead">そっくりな2匹の魚。<br>正しいのはどっち？</p>
      <div class="title-fish" id="title-fish"></div>
      <div class="menu">
        <button class="btn primary" id="btn-start">はじめる（10問）</button>
        <button class="btn" id="btn-zukan">見分け図鑑</button>
      </div>
      <p class="best" id="best-score"></p>
    </section>

    <!-- 問題 -->
    <section id="screen-quiz" class="screen">
      <header class="quiz-head">
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="status">
          <span id="q-count">1 / 10</span>
          <span id="q-score">正解 0</span>
          <span id="q-combo" class="combo"></span>
        </div>
      </header>
      <h2 class="question" id="question"></h2>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" hidden>
        <p class="verdict" id="verdict"></p>
        <p class="point" id="point"></p>
        <button class="btn primary" id="btn-next">次へ</button>
      </div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen">
      <h2 class="result-title">結果発表</h2>
      <p class="result-score"><span id="r-score">0</span><small> / <span id="r-total">10</span></small></p>
      <p class="rank" id="r-rank"></p>
      <p class="rank-msg" id="r-msg"></p>
      <div class="review" id="review"></div>
      <div class="menu">
        <button class="btn primary" id="btn-retry">もう一度</button>
        <button class="btn" id="btn-home">タイトルへ</button>
      </div>
    </section>

    <!-- 図鑑 -->
    <section id="screen-zukan" class="screen">
      <h2 class="zukan-title">見分け図鑑</h2>
      <div class="zukan" id="zukan"></div>
      <div class="menu">
        <button class="btn" id="btn-zukan-back">タイトルへ</button>
      </div>
    </section>
  </main>

  <script src="js/fish.js"></script>
  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
